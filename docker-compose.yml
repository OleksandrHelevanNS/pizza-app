services:

  discovery-service:
    build: ./discovery-service
    container_name: discovery-service
    ports:
      - "${DISCOVERY_SERVICE_PORT}:${DISCOVERY_SERVICE_PORT}"
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE}
      - SERVER_PORT=${DISCOVERY_SERVICE_PORT}
    networks:
      - pizza-shop-network
    healthcheck:
      test: [ "CMD", "nc", "-z", "localhost", "${DISCOVERY_SERVICE_PORT}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  gateway-service:
    build: ./gateway-service
    container_name: gateway-service
    ports:
      - "${GATEWAY_SERVICE_PORT}:${GATEWAY_SERVICE_PORT}"
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE}
      - EUREKA_CLIENT_SERVICE_URL_DEFAULT_ZONE=${EUREKA_CLIENT_SERVICE_URL_DEFAULT_ZONE}
      - SERVER_PORT=${GATEWAY_SERVICE_PORT}

    depends_on:
      discovery-service:
        condition: service_healthy
    networks:
      - pizza-shop-network

  cassandra:
    image: cassandra:4.1.10
    container_name: cassandra
    restart: unless-stopped
    ports:
      - "${CASSANDRA_PORT}:${CASSANDRA_PORT}"
      - "${CASSANDRA_JMX_PORT}:${CASSANDRA_JMX_PORT}"
    volumes:
      - cassandra_data:/var/lib/cassandra
    networks:
      - pizza-shop-network
    healthcheck:
      test: [ "CMD-SHELL", "cqlsh -e 'DESCRIBE KEYSPACES'" ]
      interval: 30s
      timeout: 10s
      retries: 15

  menu-service:
    build: ./menu-service
    container_name: menu-service
    ports:
      - "${MENU_SERVICE_PORT}:${MENU_SERVICE_PORT}"
    environment:
      - SERVER_PORT=${MENU_SERVICE_PORT}
      - CASSANDRA_HOST=${CASSANDRA_HOST}
      - CASSANDRA_PORT=${CASSANDRA_PORT}
      - CASSANDRA_DATACENTER=${CASSANDRA_DATACENTER}
      - CASSANDRA_KEYSPACE=${CASSANDRA_KEYSPACE}
      - EUREKA_CLIENT_SERVICE_URL_DEFAULT_ZONE=${EUREKA_CLIENT_SERVICE_URL_DEFAULT_ZONE}
    depends_on:
      cassandra:
        condition: service_healthy
      discovery-service:
        condition: service_started
    networks:
      - pizza-shop-network

networks:
  pizza-shop-network:
    driver: bridge

volumes:
  cassandra_data: