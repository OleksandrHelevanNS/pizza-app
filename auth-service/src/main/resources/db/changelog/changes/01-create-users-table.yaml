databaseChangeLog:
  - changeSet:
      id: 01-create-users-table
      author: oleksandr
      changes:
        - createTable:
            tableName: users
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: username
                  type: varchar(100)
                  constraints:
                    nullable: false
                    unique: true

              - column:
                  name: email
                  type: varchar(255)
                  constraints:
                    nullable: false
                    unique: true

              - column:
                  name: password
                  type: varchar(255)
                  constraints:
                    nullable: false

              - column:
                  name: phone
                  type: varchar(20)

              - column:
                  name: role
                  type: varchar(50)
                  constraints:
                    nullable: false
